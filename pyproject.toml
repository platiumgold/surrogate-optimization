[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "surrogate-optimization"
version = "0.1.0"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
]

[tool.setuptools]
packages = ["doe", "models", "acquisition", "optimizer", "benchmarks"]
